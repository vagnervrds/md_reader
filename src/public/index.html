<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mdreader</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>
<body class="theme-dark">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">mdreader</h1>
        <button class="btn-themes" id="btn-open-themes" title="Gerenciar temas">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar arquivos..." autocomplete="off">
      </div>
      <ul class="file-list" id="file-list"></ul>
      <div class="no-results" id="no-results" hidden>Nenhum resultado encontrado</div>
    </aside>

    <main class="content">
      <div class="topbar">
        <button class="btn-icon" id="btn-open" title="Abrir arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 11 15 14"/></svg>
        </button>
        <button class="btn-icon" id="btn-new" title="Novo arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="btn-icon" id="btn-toggle-sidebar" title="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">mdreader</span>
        <div class="spacer"></div>
        <span class="topbar-status" id="topbar-status"></span>
        <button class="btn-icon" id="btn-edit" title="Editar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon" id="btn-save" title="Salvar (Ctrl+S)" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <button class="btn-icon" id="btn-view" title="Visualizar" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="btn-icon" id="btn-reload" title="Recarregar arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="btn-icon" id="btn-theme" title="Alternar tema">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>

      <div class="view-mode" id="view-mode">
        <div class="viewer" id="viewer">
          <div class="welcome"><p>Abra um arquivo .md para comecar</p></div>
        </div>
      </div>

      <div class="edit-mode" id="edit-mode" style="display:none">
        <div class="editor-pane">
          <textarea class="editor-textarea" id="editor" spellcheck="false" placeholder="Escreva seu markdown aqui..."></textarea>
        </div>
        <div class="editor-divider"></div>
        <div class="preview-pane">
          <div class="viewer preview-viewer" id="preview-content"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-themes">
    <div class="modal">
      <div class="modal-header">
        <h2>Temas</h2>
        <button class="modal-close" id="modal-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="community">Comunidade</button>
        <button class="modal-tab" data-tab="installed">Instalados</button>
      </div>
      <div class="modal-search">
        <input type="text" id="theme-search-input" placeholder="Buscar temas..." autocomplete="off">
      </div>
      <div class="theme-grid" id="theme-grid">
        <div class="modal-loading"><div class="spinner"></div><br>Carregando temas...</div>
      </div>
    </div>
  </div>

  <div class="format-menu" id="format-menu" style="display:none">
    <div class="format-menu-section">
      <div class="format-menu-title">Formatacao</div>
      <button class="format-btn" data-format="bold"><b>B</b> Negrito</button>
      <button class="format-btn" data-format="italic"><i>I</i> Italico</button>
      <button class="format-btn" data-format="strike"><s>S</s> Tachado</button>
      <button class="format-btn" data-format="code">&lt;/&gt; Inline Code</button>
      <button class="format-btn" data-format="link">&#128279; Link</button>
    </div>
    <div class="format-menu-divider"></div>
    <div class="format-menu-section">
      <div class="format-menu-title">Estruturas</div>
      <button class="format-btn" data-format="h1"># Titulo 1</button>
      <button class="format-btn" data-format="h2">## Titulo 2</button>
      <button class="format-btn" data-format="h3">### Titulo 3</button>
      <button class="format-btn" data-format="ul">&#8226; Lista nao ordenada</button>
      <button class="format-btn" data-format="ol">1. Lista ordenada</button>
      <button class="format-btn" data-format="check">&#9744; Lista de tarefas</button>
      <button class="format-btn" data-format="quote">&#8220; Citacao</button>
      <button class="format-btn" data-format="codeblock">&#9112; Bloco de codigo</button>
      <button class="format-btn" data-format="table">&#9638; Tabela</button>
      <button class="format-btn" data-format="hr">&#8213; Linha horizontal</button>
    </div>
  </div>

  <script src="/js/marked.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
